name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/ech-image-requests

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
        env:
          HAN1ME_CRASH_R2_ENDPOINT: ${{ secrets.HAN1ME_CRASH_R2_ENDPOINT }}
          HAN1ME_CRASH_R2_BUCKET: ${{ secrets.HAN1ME_CRASH_R2_BUCKET }}
          HAN1ME_CRASH_R2_ACCESS_KEY: ${{ secrets.HAN1ME_CRASH_R2_ACCESS_KEY }}
          HAN1ME_CRASH_R2_SECRET_KEY: ${{ secrets.HAN1ME_CRASH_R2_SECRET_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: han1meplus-ech-fix-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
