name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android SDK 37 (if missing)
        run: |
          sdkmanager --install "platforms;android-37" "build-tools;37.0.0" >/dev/null 2>&1 || true
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (arm64)
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: han1meplus-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
