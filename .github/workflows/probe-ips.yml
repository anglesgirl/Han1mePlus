name: Probe Site IPs
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve real IPs
        run: |
          for h in t33.cdn2020.com cdn2020.com getchu.com vdownload.hembed.com; do
            echo -n "$h => "
            dig +short "$h" A | tr '\n' ' '
            echo -n "| CNAME: "
            dig +short "$h" CNAME | tr '\n' ' '
            echo ""
          done
