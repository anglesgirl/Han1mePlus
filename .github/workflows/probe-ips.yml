name: Probe Site IPs
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve IPs
        run: |
          for h in t33.cdn2020.com cdn2020.com t26.cdn2020.com t30.cdn2020.com shturl.cc; do
            echo -n "$h => "
            dig +short "$h" A | tr '\n' ' '
            echo -n "| v6: "
            dig +short "$h" AAAA | tr '\n' ' '
            echo -n "| CNAME: "
            dig +short "$h" CNAME | tr '\n' ' '
            echo ""
          done
